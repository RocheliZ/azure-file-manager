name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-filemgr-rocheli1104

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build React into src/FileManager.Api/wwwroot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Build frontend
        working-directory: src/web
        run: |
          npm ci
          npm run build

      # Publish the API (includes wwwroot)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish API
        run: dotnet publish src/FileManager.Api/FileManager.Api.csproj -c Release -o publish

      # Deploy with the publish profile stored as a GitHub secret
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
